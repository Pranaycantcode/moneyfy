services:
  postgres:
    image: postgres:16
    container_name: moneyfy-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: moneyfy_user
      POSTGRES_PASSWORD: moneyfy_password
      POSTGRES_DB: moneyfy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: